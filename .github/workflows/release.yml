name: Build Windows release

# Push a version tag (v0.1.0, v0.1.1, …) and this builds the Windows installer,
# signs it for the auto-updater, and publishes it as a GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run frontend tests
        run: npm test

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Generate these once with:  npm run tauri signer generate
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "JWS Forms __VERSION__"
          releaseBody: |
            Download **JWS.Forms___VERSION___x64-setup.exe** below and run it.

            Already have JWS Forms installed? You do not need this page — the app
            will offer the update the next time you open it.
          releaseDraft: false
          prerelease: false
          # Writes latest.json, which is what the in-app updater reads.
          includeUpdaterJson: true
