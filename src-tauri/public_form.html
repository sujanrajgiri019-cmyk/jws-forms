<html lang="en">

<style>
/* The typefaces and the form stylesheet are the app's own, served from this
   PC — the shared page and the desktop app cannot drift apart, and a phone
   needs no internet connection beyond reaching this address. */
@font-face {
  font-family: "Archivo";
  src: url("/f/archivo.woff2") format("woff2-variations");
  font-weight: 100 900; font-stretch: 62% 125%; font-display: swap;
}
@font-face {
  font-family: "Public Sans";
  src: url("/f/body.woff2") format("woff2-variations");
  font-weight: 100 900; font-display: swap;
}
:root {
  --display: "Archivo", "Segoe UI", system-ui, sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --ease: cubic-bezier(.22, .68, .35, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100%; background: #fff; }
body { font-family: var(--body); -webkit-font-smoothing: antialiased; }
#app { min-height: 100vh; display: flex; flex-direction: column; }
#app > .fs { flex: 1; }
.spin {
  width: 17px; height: 17px; border-radius: 99px; display: inline-block;
  border: 2px solid currentColor; border-top-color: transparent;
  animation: rot .7s linear infinite; vertical-align: -3px;
}
@keyframes rot { to { transform: rotate(360deg); } }
.fatal { max-width: 34rem; margin: 18vh auto; padding: 0 24px; font-family: var(--body); color: #4E3D2F; }
.fatal h1 { font-family: var(--display); font-stretch: 116%; }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

__FORM_CSS__
</style>
</head>

<div id="app"></div>

var answers = {};
var errors = {};
var step = 0;

/* ------------------------------------------------------------- utilities */

/* The mark is served by the app at /logo.png — the original artwork, drawn

    src: "/logo.png", alt: BRAND.name,
    style: "height:" + h + "px;width:" + Math.round(h * BRAND.aspect) + "px;object-fit:contain;display:block"
  });

    el("span", {}, [BRAND.address]),

}
/* Styles that put the branding in a panel beside the form rather than above

var SIDE_STYLES = ["panel", "split", "prospectus"];
function hasSide() { return SIDE_STYLES.indexOf(STYLE) >= 0; }

/* ------------------------------------------------------------- text styles
   Mirrors src/lib/richtext.tsx. A colour that isn't a plain hex is dropped
   rather than trusted — this string goes straight into a style attribute. */

var TEXT_SIZES = { "-1": "0.86em", "0": "1em", "1": "1.22em", "2": "1.5em" };

  display: "var(--display)", body: "var(--body)",
  mono: 'ui-monospace, "Cascadia Mono", Consolas, monospace'

function textStyle(t) {
  if (!t) return null;
  var out = [];
  if (t.bold) out.push("font-weight:800");
  if (t.italic) out.push("font-style:italic");
  if (t.underline) out.push("text-decoration:underline");
  if (t.size) out.push("font-size:" + (TEXT_SIZES[String(t.size)] || "1em"));
  if (t.color && /^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(String(t.color).trim()))
    out.push("color:" + String(t.color).trim());
  if (t.font && TEXT_FONTS[t.font]) out.push("font-family:" + TEXT_FONTS[t.font]);

function bannerBlock() {
  var st = settings();

  return el("div", { class: "fs-banner " + (st.bannerHeight || "medium") }, [
    el("img", { src: st.banner, alt: "" })
  ]);
}

function questions() { return FORM.questions || []; }
function isDisplayBlock(t) { return t === "section" || t === "image"; }

/* ------------------------------------------------------- conditional logic
   Mirrors src/lib/logic.ts. A hidden question keeps its answer and still owns
   its Excel column — it is submitted blank. */

function answerText(v) {
  if (v === null || v === undefined) return "";
  if (Array.isArray(v)) return v.join(", ");
  if (typeof v === "object") {
    return Object.keys(v).map(function (k) {
      var x = v[k];
      return Array.isArray(x) ? x.join(", ") : String(x === null || x === undefined ? "" : x);
    }).join(", ");
  }
  return String(v);
}

  if (v === null || v === undefined) return [];
  if (Array.isArray(v)) return v.map(String);
  if (typeof v === "object") {
    var out = [];
    Object.keys(v).forEach(function (k) {
      var x = v[k];
      if (Array.isArray(x)) out = out.concat(x.map(String));
      else out.push(String(x === null || x === undefined ? "" : x));

}

  return vals.map(function (x) { return String(x === null || x === undefined ? "" : x).trim(); })
             .filter(function (x) { return x !== ""; });
}

  var text = answerText(raw).trim();
  var list = answerList(raw).map(function (x) { return x.trim(); });
  var want = ruleWanted(r);
  function hit(v) { return want.some(function (w) { return v.toLowerCase() === w.toLowerCase(); }); }
  switch (r.operator) {
    case "is_empty": return text === "";
    case "is_not_empty": return text !== "";
    case "equals": return want.length === 0 ? text === "" : list.some(hit);
    case "not_equals": return want.length === 0 ? text !== "" : !list.some(hit);
    case "contains":
      return want.some(function (w) { return text.toLowerCase().indexOf(w.toLowerCase()) >= 0; });

/* ------------------------------------------------------- section routing
   Mirrors sectionsOf / reachedSections in src/lib/logic.ts. */

var SUBMIT_SECTION = "__submit__";

  var out = [{ id: "", title: "", blocks: [] }];
  questions().forEach(function (q) {
    if (q.type === "section") out.push({ id: q.id, title: q.title || "Section", blocks: [q] });
    else out[out.length - 1].blocks.push(q);
  });
  return out[0].blocks.length ? out : out.slice(1);
}

  var secs = sectionsOf();

  var indexOf = {};
  secs.forEach(function (s, i) { indexOf[s.id] = i; });

  var i = 0;
  while (i >= 0 && i < secs.length) {
    var sec = secs[i];
    if (reached[sec.id]) break;          // loop guard
    reached[sec.id] = true;

    var target;
    for (var b = 0; b < sec.blocks.length; b++) {
      var q = sec.blocks[b];
      if (q.type !== "multiple_choice") continue;
      var picked = answers[q.id];
      if (typeof picked !== "string" || !picked) continue;
      var opt = (q.options || []).filter(function (o) { return o.label === picked; })[0];
      if (opt && opt.goTo) { target = opt.goTo; break; }
    }
    if (target === undefined) target = (sec.blocks[0] && sec.blocks[0].nextSection) || "";

    if (target === SUBMIT_SECTION) break;
    if (!target) { i += 1; continue; }
    var next = indexOf[target];
    i = next === undefined ? i + 1 : next;

function hiddenSet() {
  var hidden = {};
  // Sections nobody routed to behave exactly like hidden questions.
  var reached = reachedSections();
  sectionsOf().forEach(function (sec) {
    if (reached[sec.id]) return;
    sec.blocks.forEach(function (b) { hidden[b.id] = true; });
  });
  questions().forEach(function (q) {
    if (hidden[q.id]) return;
    var c = q.conditions;
    if (!c || !c.rules || !c.rules.length) return;
    var results = c.rules.map(function (r) { return hidden[r.fieldId] ? false : evaluateRule(r); });
    var matched = c.match === "any"
      ? results.some(Boolean)

  var hidden = hiddenSet();

  // still while somebody is answering.

  sectionsOf().forEach(function (sec) {
    var here = sec.blocks.filter(function (b) { return !hidden[b.id]; });

      here.filter(function (b) { return b.type === "section"; }),
      shuffled(here.filter(function (b) { return b.type !== "section"; }), true, FORM.id + sec.id)
    );

/* -------------------------------------------------------------- masking
   Mirrors src/lib/mask.ts. */

function maskAccepts(slot, ch) {
  if (slot === "9") return ch >= "0" && ch <= "9";
  if (slot === "A") return /[a-z]/i.test(ch);

      if (i >= src.length) break;

      if (src[i] === slot) i++;

function answerable() { return visibleBlocks().filter(function (q) { return !isDisplayBlock(q.type); }); }
function settings() { return FORM.settings || {}; }

/* ---------------------------------------------------------- answers model
   These four functions mirror src/lib/answers.ts exactly. Change one, change
   the other, or the two routes will write different columns. */

function headersFor(q) {
  var t = (q.title || "Untitled question").trim();
  if (q.type === "grid_choice" || q.type === "grid_checkbox")
    return (q.rows || []).map(function (r) { return t + " [" + r.label + "]"; });
  return [t];
}

  if (q.type === "grid_checkbox")
    return (q.rows || []).map(function (r) { return ((v && v[r.id]) || []).join(", "); });

  if (q.type === "grid_choice")
    return (q.rows || []).length > 0 && q.rows.every(function (r) { return v && v[r.id]; });

      if (q.countRule === "at_most" && n > want) return "Choose no more than " + want + " option" + plural + ".";

  if (q.type === "number" && !q.mask && isNaN(Number(s))) return "Enter a number.";

/* ------------------------------------------------------------------ field */

function field(q) {

        // when something actually depends on this question.
        if (drivesLogic(q.id)) { scheduleRelayout(); return; }
        if (errors[q.id]) { delete errors[q.id]; paintErrors(); }
      }
    });
  }

  switch (q.type) {
    case "paragraph":
      return el("textarea", {
        class: "fs-textarea", placeholder: q.placeholder || "",
        oninput: function (e) { answers[q.id] = e.target.value; if (errors[q.id]) { delete errors[q.id]; paintErrors(); } }
      }, [str]);
    case "number": return textish("number");
    case "email": return textish("email");
    case "phone": return textish("tel");
    case "date": {
      var d = textish("date", " fs-narrow");
      if (q.minDate) d.setAttribute("min", q.minDate);
      if (q.maxDate) d.setAttribute("max", q.maxDate);
      return d;
    }
    case "time": return textish("time", " fs-narrow");
    case "short_text": return textish("text");

    case "dropdown": {
      var opts = [el("option", { value: "" }, ["Choose…"])];
      shuffled(q.options || [], q.shuffle, q.id).forEach(function (o) {
        opts.push(el("option", { value: o.label, selected: str === o.label }, [o.label]));
      });
      return el("select", {
        class: "fs-select",
        onchange: function (e) { setAnswer(q.id, e.target.value); }
      }, opts);
    }

    case "multiple_choice":
    case "checkboxes": return choices(q);

    case "photo":
    case "file": return uploadField(q, str);

    case "linear_scale": {
      var wrap = el("div", {}, []);
      var row = el("div", { class: "fs-scale" }, []);
      var min = (q.scale && q.scale.min) || 0, max = (q.scale && q.scale.max) || 5;
      if (q.scale && q.scale.min === undefined) min = 1;
      for (var i = min; i <= max; i++) {
        (function (n) {
          row.appendChild(el("label", { class: str === String(n) ? "on" : null }, [
            String(n),
            el("input", {
              type: "radio", name: q.id, checked: str === String(n),
              onchange: function () { setAnswer(q.id, String(n)); }
            })
          ]));
        })(i);
      }
      wrap.appendChild(row);
      if (q.scale && (q.scale.minLabel || q.scale.maxLabel)) {
        wrap.appendChild(el("div", { class: "fs-ends" }, [
          el("span", {}, [q.scale.minLabel || ""]),
          el("span", {}, [q.scale.maxLabel || ""])
        ]));
      }
      return wrap;
    }

    case "rating": {
      var n = Number(str) || 0, stars = el("div", { class: "fs-stars" }, []);
      for (var s = 1; s <= (q.ratingMax || 5); s++) {
        (function (k) {
          stars.appendChild(el("button", {
            type: "button", class: "fs-star" + (k <= n ? " on" : ""),
            "aria-label": k + " of " + (q.ratingMax || 5), html: ICON.star,
            onclick: function () { setAnswer(q.id, k === n ? "" : String(k)); }
          }));
        })(s);
      }
      return stars;
    }

    case "grid_choice":
    case "grid_checkbox": return grid(q);
  }
  return el("div", {});
}

function choices(q) {
  var multi = q.type === "checkboxes";
  var v = answers[q.id];
  var chosen = multi ? (v || []) : (typeof v === "string" && v ? [v] : []);
  var known = {};
  (q.options || []).forEach(function (o) { known[o.label] = 1; });
  var otherText = "";
  chosen.forEach(function (c) { if (!known[c]) otherText = c; });

  function pick(label, on) {
    if (!multi) { setAnswer(q.id, on ? label : ""); return; }
    var set = chosen.filter(function (c) { return c !== label; });
    if (on) set.push(label);
    setAnswer(q.id, set);
  }
  function setOther(text) {
    var rest = chosen.filter(function (c) { return known[c]; });
    if (!multi) { answers[q.id] = text; paintErrors(); return; }
    answers[q.id] = text ? rest.concat([text]) : rest;
    paintErrors();
  }

  var box = el("div", { class: "fs-choices", role: multi ? "group" : "radiogroup" }, []);

  shuffled(q.options || [], q.shuffle, q.id).forEach(function (o, i) {
    var on = chosen.indexOf(o.label) >= 0;
    var kids = [];
    if (STYLE === "focus") kids.push(el("span", { class: "fs-mark" }, [LETTERS[i] || "•"]));
    else if (STYLE !== "panel") kids.push(el("span", { class: "fs-mark", "aria-hidden": "true" }));
    kids.push(el("span", { class: "fs-choice-txt" }, [o.label]));
    box.appendChild(el("button", {
      type: "button", role: multi ? "checkbox" : "radio", "aria-checked": on ? "true" : "false",
      class: "fs-choice" + (on ? " on" : ""),
      onclick: function () { pick(o.label, !on); }
    }, kids));
  });

  if (q.hasOther) {
    var input = el("input", {
      type: "text", value: otherText, placeholder: "Your answer", "aria-label": "Other answer",
      oninput: function (e) { setOther(e.target.value); }
    });
    var kids2 = [];
    if (STYLE === "focus") kids2.push(el("span", { class: "fs-mark" }, [LETTERS[(q.options || []).length] || "•"]));
    else if (STYLE !== "panel") kids2.push(el("span", { class: "fs-mark", "aria-hidden": "true" }));
    kids2.push(el("span", { class: "fs-other" }, ["Other:", input]));
    box.appendChild(el("div", {
      class: "fs-choice other-chip" + (otherText ? " on" : ""),
      onclick: function (e) { if (e.target.tagName !== "INPUT" && !otherText) setOther("Other"); }
    }, kids2));
  }
  return box;
}

function grid(q) {
  var multi = q.type === "grid_checkbox";
  var m = answers[q.id] || {};
  var head = [el("th", {})];
  (q.columns || []).forEach(function (c) { head.push(el("th", {}, [c.label])); });

  var body = [];
  (q.rows || []).forEach(function (r) {
    var cells = [el("td", {}, [r.label])];
    (q.columns || []).forEach(function (c) {
      var on = multi ? ((m[r.id] || []).indexOf(c.label) >= 0) : m[r.id] === c.label;
      cells.push(el("td", {}, [el("input", {
        type: multi ? "checkbox" : "radio",
        name: q.id + "-" + r.id,
        checked: on,
        "aria-label": r.label + " — " + c.label,
        onchange: function (e) {
          var next = {};
          for (var k in m) next[k] = m[k];
          if (multi) {
            var set = (next[r.id] || []).filter(function (x) { return x !== c.label; });
            if (e.target.checked) set.push(c.label);
            next[r.id] = set;
          } else next[r.id] = c.label;
          setAnswer(q.id, next);
        }
      })]));
    });
    body.push(el("tr", {}, cells));
  });

  return el("div", { class: "fs-gridwrap" }, [
    el("table", { class: "fs-grid" }, [
      el("thead", {}, [el("tr", {}, head)]),
      el("tbody", {}, body)
    ])
  ]);
}

/* --------------------------------------------------------------- pictures */

/* Downscale before keeping, so a phone photo does not become a 6 MB POST. */
function readPicture(file, done, fail) {
  if (!file || file.type.indexOf("image/") !== 0) { fail("That file is not a picture."); return; }
  if (file.size > 25 * 1024 * 1024) { fail("That picture is too large. Try one under 25 MB."); return; }
  var reader = new FileReader();
  reader.onerror = function () { fail("Could not read that file."); };
  reader.onload = function () {
    var src = String(reader.result || "");
    var img = new Image();
    img.onerror = function () { fail("That picture could not be opened."); };
    img.onload = function () {
      var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      var scale = Math.min(1, 1600 / Math.max(w, h));
      if (scale === 1 && src.length < 900000) { done(src); return; }
      var ow = Math.max(1, Math.round(w * scale)), oh = Math.max(1, Math.round(h * scale));
      var c = document.createElement("canvas");
      c.width = ow; c.height = oh;
      var ctx = c.getContext("2d");
      if (!ctx) { done(src); return; }
      ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, ow, oh);
      ctx.drawImage(img, 0, 0, ow, oh);
      done(c.toDataURL("image/jpeg", 0.86));
    };
    img.src = src;
  };
  reader.readAsDataURL(file);
}

function humanSize(n) {
  var real = Math.round(n * 3 / 4);
  if (real < 1024) return real + " B";
  if (real < 1048576) return Math.round(real / 1024) + " KB";
  return (real / 1048576).toFixed(1) + " MB";
}

/* A picture the form shows. Asks nothing, so it owns no column. */
function pictureBlock(q) {
  if (!q.image) return null;
  var fig = el("figure", { class: "fs-figure " + (q.imageWidth || "medium") }, [
    el("img", { src: q.image, alt: q.imageCaption || q.title || "" })
  ]);
  if (q.imageCaption) fig.appendChild(el("figcaption", { class: "fs-figcap" }, [q.imageCaption]));
  if (!q.title) return fig;
  return el("section", { class: "fs-section" }, [el("h2", { class: "dsp" }, [q.title]), fig]);
}

/* ------------------------------------------------------------- attachments
   Mirrors src/lib/upload.ts. A picture goes through the canvas; anything else
   is carried as-is, so the size cap is what keeps a term of responses from
   filling the disk. */

var KIND_LABEL = {
  image: "Pictures", document: "Documents (PDF, Word, Excel)",
  video: "Video", audio: "Audio", any: "Any file"
};
var KIND_ACCEPT = {
  image: "image/*",
  document: ".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,application/pdf",
  video: "video/*", audio: "audio/*", any: ""
};
var DEFAULT_MAX_MB = 25, ABSOLUTE_MAX_MB = 200;

function uploadKinds(q) {
  var k = (q.uploadKinds && q.uploadKinds.length) ? q.uploadKinds : (q.type === "photo" ? ["image"] : ["any"]);
  return k;
}
function uploadMaxMb(q) {
  var n = Number(q.maxFileMb);
  return (isFinite(n) && n > 0) ? Math.min(n, ABSOLUTE_MAX_MB) : DEFAULT_MAX_MB;
}
function uploadAccept(q) {
  var kinds = uploadKinds(q);
  if (kinds.indexOf("any") >= 0) return null;
  return kinds.map(function (k) { return KIND_ACCEPT[k]; }).filter(Boolean).join(",");
}
function matchesKind(file, kind) {
  var t = (file.type || "").toLowerCase(), name = (file.name || "").toLowerCase();
  if (kind === "any") return true;
  if (kind === "image") return t.indexOf("image/") === 0;
  if (kind === "video") return t.indexOf("video/") === 0;
  if (kind === "audio") return t.indexOf("audio/") === 0;
  if (kind === "document")
    return t === "application/pdf" || t.indexOf("word") >= 0 || t.indexOf("excel") >= 0 ||
           t.indexOf("spreadsheet") >= 0 || t.indexOf("presentation") >= 0 ||
           t.indexOf("text/") === 0 || /\.(pdf|docx?|xlsx?|pptx?|txt|csv)$/.test(name);
  return false;
}
function packAttachment(name, dataUrl) { return "name=" + encodeURIComponent(name) + "|" + dataUrl; }
function unpackAttachment(v) {
  var m = /^name=([^|]*)\|([\s\S]*)$/.exec(v || "");
  return m ? { name: decodeURIComponent(m[1]), dataUrl: m[2] } : { name: "", dataUrl: v || "" };
}

function readAttachment(q, file, done, fail) {
  var kinds = uploadKinds(q);
  var ok = kinds.some(function (k) { return matchesKind(file, k); });
  if (!ok) {
    fail("That file type isn't accepted here. Allowed: " +
         kinds.map(function (k) { return KIND_LABEL[k]; }).join(", ") + ".");
    return;
  }
  if (file.size > uploadMaxMb(q) * 1024 * 1024) {
    fail("That file is " + humanSize(file.size * 4 / 3) + " \u2014 the limit here is " + uploadMaxMb(q) + " MB.");
    return;
  }
  if ((file.type || "").indexOf("image/") === 0) {
    readPicture(file, function (url) { done(packAttachment(file.name, url)); }, fail);
    return;
  }
  var reader = new FileReader();
  reader.onerror = function () { fail("Could not read that file."); };
  reader.onload = function () { done(packAttachment(file.name, String(reader.result || ""))); };
  reader.readAsDataURL(file);
}

function uploadField(q, str) {
  var kinds = uploadKinds(q);
  var imageOnly = kinds.length === 1 && kinds[0] === "image";

  if (str) {
    var a = unpackAttachment(str);
    var isImage = a.dataUrl.indexOf("data:image/") === 0;
    return el("div", { class: "fs-shot" }, [
      isImage
        ? el("img", { src: a.dataUrl, alt: a.name || "The file you attached" })
        : el("span", { class: "fs-filemark", html: ICON.file }),
      el("div", { class: "meta" }, [
        a.name ? el("b", { class: "fs-filename" }, [a.name]) : null,
        "Attached \u00b7 about " + humanSize(a.dataUrl.length),
        el("br"),
        el("button", { type: "button", onclick: function () { setAnswer(q.id, ""); } },
           ["Remove and choose another"])
      ])
    ]);
  }

  var attrs = {
    type: "file",
    onchange: function (e) {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      box.querySelector("b").textContent = "Adding\u2026";
      readAttachment(q, f, function (packed) { setAnswer(q.id, packed); },
                     function (msg) { box.querySelector("b").textContent = msg; });
    }
  };
  var acc = uploadAccept(q);
  if (acc) attrs.accept = acc;
  if (imageOnly) attrs.capture = "environment";
  var input = el("input", attrs);

  var box = el("label", { class: "fs-drop" }, [
    el("span", { html: imageOnly ? ICON.camera : ICON.upload }),
    el("b", {}, [imageOnly ? "Take a photo or choose a file" : "Choose a file"]),
    el("s", {}, [kinds.map(function (k) { return KIND_LABEL[k]; }).join(" \u00b7 ") +
                 " \u00b7 up to " + uploadMaxMb(q) + " MB"]),
    input
  ]);
  return box;
}

/* ------------------------------------------------------------ quiz marking
   Mirrors src/lib/quiz.ts. Only questions the respondent actually saw count. */

var MARKABLE = ["short_text","number","email","phone","multiple_choice","checkboxes",
                "dropdown","date","time","linear_scale","rating"];

function normAnswer(x) { return String(x === null || x === undefined ? "" : x).trim().toLowerCase().replace(/\s+/g, " "); }

function isMarkable(q) { return MARKABLE.indexOf(q.type) >= 0 && (q.answerKey || []).length > 0; }

function questionPoints(q) { var n = Number(q.points); return isFinite(n) && n > 0 ? n : 0; }

function isCorrect(q) {
  if (!isMarkable(q)) return null;
  var key = (q.answerKey || []).map(normAnswer).filter(Boolean);
  if (!key.length) return null;

  if (q.type === "checkboxes") {
    var given = (answers[q.id] || []).map(normAnswer).filter(Boolean);
    if (given.length !== key.length) return false;
    var left = key.slice();
    for (var i = 0; i < given.length; i++) {
      var at = left.indexOf(given[i]);
      if (at < 0) return false;
      left.splice(at, 1);
    }
    return left.length === 0;
  }
  var v = answers[q.id];
  var flat = Array.isArray(v) ? v.join(", ")
           : (v && typeof v === "object") ? Object.keys(v).map(function (k) { return v[k]; }).join(", ")
           : v;
  var got = normAnswer(flat);
  return got ? key.indexOf(got) >= 0 : false;
}

function markQuiz() {
  var hidden = hiddenSet(), score = 0, total = 0, marked = [];
  questions().forEach(function (q) {
    if (hidden[q.id] || !isMarkable(q)) return;
    var pts = questionPoints(q), ok = isCorrect(q) === true;
    total += pts;
    if (ok) score += pts;
    marked.push({ q: q, correct: ok, points: pts });
  });
  return { score: score, total: total, marked: marked };
}

function quizScoreBlock() {
  var r = markQuiz();
  if (!r.marked.length) return null;
  var pct = r.total > 0 ? Math.round((r.score / r.total) * 100) : 0;

  var list = el("ul", { class: "fs-marks" }, []);
  r.marked.forEach(function (m) {
    var note = m.correct ? m.q.feedbackCorrect : m.q.feedbackWrong;
    var body = el("span", { class: "body" }, [
      el("b", {}, [(m.q.title || "").trim() || "Untitled question"])
    ]);
    if (!m.correct && (m.q.answerKey || []).length)
      body.appendChild(el("s", {}, ["Correct answer: " + m.q.answerKey.join(" / ")]));
    if (note) body.appendChild(el("s", {}, [note]));
    list.appendChild(el("li", { class: m.correct ? "ok" : "no" }, [
      el("span", { class: "tick", html: m.correct ? ICON.markOk : ICON.markNo }),
      body,
      el("span", { class: "pts" }, [(m.correct ? m.points : 0) + "/" + m.points])
    ]));
  });

  return el("div", { class: "fs-score" }, [
    el("div", { class: "fs-scorehead" }, [
      el("span", { class: "lbl" }, ["Your score"]),
      el("b", {}, [String(r.score), el("s", {}, ["/" + r.total])]),
      el("span", { class: "pc" }, [pct + "%"])
    ]),
    list
  ]);
}

/* ---------------------------------------------------------------- the slip
   Mirrors src/fill/Receipt.tsx. A parent can print it at home or save it as a
   PDF from the phone's own share sheet. */

function formatToken(count) {
  var r = settings().receipt || {};
  if (!r.enabled || r.showToken === false) return "";
  var n = String(Math.max(1, count || 1));
  while (n.length < 4) n = "0" + n;
  return (r.tokenPrefix || "") + n;
}

function receiptSlip(token) {
  var r = settings().receipt || {};
  var hidden = hiddenSet();
  var rows = el("dl", { class: "slip-rows" }, [
    el("div", {}, [el("dt", {}, ["Received"]), el("dd", {}, [new Date().toLocaleString()])])
  ]);

  (r.fields || []).forEach(function (id) {
    var q = questions().filter(function (x) { return x.id === id; })[0];
    if (!q || hidden[id]) return;
    var v = valuesFor(q).filter(Boolean).join(", ");
    if (!v) return;
    rows.appendChild(el("div", {}, [
      el("dt", {}, [(q.title || "").trim() || "Answer"]),
      el("dd", {}, [v])
    ]));
  });

  return el("div", { class: "slip", id: "jws-slip" }, [
    el("div", { class: "slip-head" }, [
      // The mark alone — the name is set beside it, so a lockup would print
      // "Janapremi World School" twice.
      logoImg(38, false),
      el("div", { class: "slip-org" }, [
        el("b", {}, [BRAND.name]),
        el("span", {}, [BRAND.address]),
        el("span", {}, [BRAND.phones])
      ])
    ]),
    el("h3", { class: "slip-title" }, [(r.title || "").trim() || FORM.title || "Acknowledgement"]),
    token ? el("div", { class: "slip-token" }, [
      el("span", { class: "lbl" }, ["Token"]),
      el("b", {}, [token])
    ]) : null,
    rows,
    (r.note || "").trim() ? el("p", { class: "slip-note" }, [r.note]) : null,
    el("div", { class: "slip-foot" }, [
      el("span", {}, [FORM.title || "JWS Forms"]),
      el("span", {}, ["Office copy \u00b7 not a receipt of payment"])
    ])
  ]);
}

/* ------------------------------------------------------------ question block */

function questionBlock(q, index) {

  }, [

function sectionBlock(q) {

/* ------------------------------------------------------------- panel wall */

function panelSide() {
  var groups = [], cur = { title: "Questions", qs: [] };
  visibleBlocks().forEach(function (q) {
    if (q.type === "section") {
      if (cur.qs.length) groups.push(cur);
      cur = { title: q.title || "Section", qs: [] };
    } else if (q.type !== "image") cur.qs.push(q);
  });
  if (cur.qs.length) groups.push(cur);

  function answeredIn(qs) {
    return qs.filter(function (q) {
      var save = answers[q.id];
      return save !== undefined && (Array.isArray(save) ? save.length : String(save || "").trim() !== "" || typeof save === "object");
    }).length;
  }

  var firstUnfinished = -1;
  groups.forEach(function (g, i) {
    if (firstUnfinished < 0 && answeredIn(g.qs) < g.qs.length) firstUnfinished = i;
  });

  var kids = [
    bannerBlock(),
    letterhead({ height: 56, plate: true, onDark: true }),
    el("h1", {
      class: "dsp",
      style: "margin-top:26px;" + (textStyle(settings().titleStyle) || "")
    }, [FORM.title || "Untitled form"]),
    FORM.description
      ? el("p", { class: "fs-desc", style: textStyle(settings().descriptionStyle) }, [FORM.description])
      : null
  ];

  if (groups.length > 1) {
    var steps = el("div", { class: "fs-steps" }, []);
    groups.forEach(function (g, i) {
      var a = answeredIn(g.qs);
      var state = a === g.qs.length ? "done" : (i === firstUnfinished ? "now" : "pending");
      steps.appendChild(el("div", { class: "fs-step " + state }, [
        el("span", { class: "fs-stepdot" }),
        el("span", {}, [
          el("b", {}, [g.title]),
          el("s", {}, [state === "done" ? "Complete" : a + " of " + g.qs.length + " answered"])
        ])
      ]));
    });
    kids.push(steps);
  }

  var pct = Math.round(completion() * 100);
  kids.push(el("div", { class: "fs-prog" }, [
    el("span", { class: "lbl" }, ["Progress · " + pct + "%"]),
    el("div", { class: "fs-track" }, [el("i", { style: "width:" + pct + "%" })])
  ]));

  return el("aside", { class: "fs-side" }, kids);
}

/* ----------------------------------------------------------------- submit */

function submitAll() {
  errors = {};
  visibleBlocks().forEach(function (q) {
    var m = validate(q);
    if (m) errors[q.id] = m;
  });
  if (Object.keys(errors).length) {
    render();
    var first = visibleBlocks().filter(function (q) { return errors[q.id]; })[0];
    var node = first && document.querySelector('[data-q="' + first.id + '"]');
    if (node) node.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  send();
}

function send() {
  var headers = [], values = [], hidden = hiddenSet();
  if (settings().collectTimestamp !== false) {
    headers.push("Timestamp");
    values.push(new Date().toLocaleString());
  }
  // Every column is written, hidden ones blank, so the sheet keeps one shape
  // whether or not a branch was taken.
  questions().forEach(function (q) {
    if (isDisplayBlock(q.type)) return;
    var cols = headersFor(q);
    cols.forEach(function (h) { headers.push(h); });
    if (hidden[q.id]) cols.forEach(function () { values.push(""); });
    else valuesFor(q).forEach(function (v) { values.push(v); });
  });

  // A quiz carries its marks in the last two columns.
  if (settings().quiz) {
    var r = markQuiz();
    headers.push("Score", "Out of");
    values.push(String(r.score), String(r.total));
  }

  sending = true;
  render();
  fetch("/submit", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ headers: headers, values: values })
  })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      sending = false;
      if (!d.ok) throw new Error(d.error || "The school computer could not save this response.");
      renderDone(formatToken(d.count));
    })
    .catch(function (e) {
      sending = false;
      render();
      alert("Could not send your answers.\n\n" + e.message +
        "\n\nYour answers are still on this page — try Submit again in a moment.");
    });
}

function advance() {
  var qs = visibleBlocks(), q = qs[Math.min(step, Math.max(qs.length - 1, 0))];
  if (q && !isDisplayBlock(q.type)) {
    var m = validate(q);
    if (m) { errors = {}; errors[q.id] = m; render(); return; }
  }
  if (step < qs.length - 1) { step++; errors = {}; render(); }
  else submitAll();
}

/* Repaint only the error lines, so typing does not rebuild the whole page
   (which would steal focus from the box you are typing in). */
function paintErrors() {
  if (hasSide()) {
    var side = document.querySelector(".fs-side");
    if (side) side.replaceWith(panelSide());
  }
}

/* ----------------------------------------------------------------- render */

function render() {
  var closed = settings().acceptingResponses === false;
  document.body.classList.remove("slip-on");
  app.innerHTML = "";

  if (STYLE === "focus") { renderFocus(closed); return; }

  var root = el("div", { class: rootClass() }, []);
  if (hasSide()) root.appendChild(panelSide());

  var main = el("div", { class: "fs-main" }, []);

  if (!hasSide()) {
    main.appendChild(el("header", { class: "fs-head" }, [
      bannerBlock(),
      el("div", { class: "fs-brand" }, [
        letterhead({
          height: STYLE === "cover" ? 58 : 68,
          plate: STYLE === "cover",
          onDark: STYLE === "cover"
        })
      ]),
      el("h1", { class: "dsp", style: textStyle(settings().titleStyle) }, [FORM.title || "Untitled form"]),
      FORM.description
        ? el("p", { class: "fs-desc", style: textStyle(settings().descriptionStyle) }, [FORM.description])
        : null,
      answerable().some(function (q) { return q.required; })
        ? el("p", { class: "fs-headnote" }, [el("span", { class: "fs-req" }, ["*"]), " Required"])
        : null
    ]));
  }

  if (closed) {
    main.appendChild(el("div", { style: hasSide() ? "padding-bottom:8px" : "padding:24px 0 0" }, [
      el("div", { class: "fs-closed" }, [
        el("span", { html: ICON.alert }),
        el("span", {}, ["This form is closed and is not accepting responses at the moment."])
      ])
    ]));
  }

  var flow = el("div", { class: "fs-flow" }, []);
  var n = 0;
  visibleBlocks().forEach(function (q) {
    if (q.type === "section") { flow.appendChild(sectionBlock(q)); return; }
    if (q.type === "image") { var pb = pictureBlock(q); if (pb) flow.appendChild(pb); return; }
    n++;
    flow.appendChild(questionBlock(q, n));
  });
  main.appendChild(flow);

  main.appendChild(el("footer", { class: "fs-foot" }, [
    el("button", {
      class: "fs-submit", type: "button", disabled: sending || closed,
      onclick: submitAll
    }, [sending ? el("span", { class: "spin" }) : null, sending ? " Sending…" : "Submit"])
  ]));

  root.appendChild(main);
  app.appendChild(root);
}

function renderFocus(closed) {
  var qs = visibleBlocks(), q = qs[Math.min(step, Math.max(qs.length - 1, 0))];
  if (!q) return;
  var pct = Math.round(completion() * 100);
  var last = step === qs.length - 1;

  var index = 0;
  for (var i = 0; i <= step; i++) if (!isDisplayBlock(qs[i].type)) index++;

  var stage = q.type === "section" ? sectionBlock(q)
            : q.type === "image" ? (pictureBlock(q) || sectionBlock(q))
            : questionBlock(q, index);

  app.appendChild(el("div", { class: rootClass() }, [
    el("div", { class: "fs-watermark" }, [el("img", { src: "/logo.png", alt: "" })]),
    el("div", { class: "fs-topbar" }, [el("i", { style: "width:" + Math.max(pct, 4) + "%" })]),
    el("div", { class: "fs-crumb" }, [
      el("span", { class: "l" }, [letterhead({ height: 34, compact: true })]),
      el("span", { class: "lbl" }, [FORM.title || "Untitled form"])
    ]),
    el("div", { class: "fs-main" }, [
      closed ? el("div", { style: "padding:24px 28px 0;max-width:620px;margin:0 auto;width:100%" }, [
        el("div", { class: "fs-closed" }, [
          el("span", { html: ICON.alert }),
          el("span", {}, ["This form is closed and is not accepting responses at the moment."])
        ])
      ]) : null,
      el("div", { class: "fs-flow" }, [stage])
    ]),
    el("div", { class: "fs-nav" }, [
      el("div", { class: "inner" }, [
        el("button", {
          class: "fs-back", type: "button", disabled: step === 0,
          onclick: function () { if (step > 0) { step--; errors = {}; render(); } }
        }, ["← Back"]),
        el("button", {
          class: last ? "fs-submit" : "fs-next", type: "button",
          disabled: sending || (last && closed), onclick: advance
        }, [sending ? "Sending…" : (last ? "Submit" : "Next")]),
        el("span", { class: "fs-kbd" }, ["or press ", el("kbd", {}, ["Enter"])])
      ])
    ])
  ]));

  var auto = app.querySelector(".fs-input, .fs-textarea");
  if (auto && (q.type === "short_text" || q.type === "paragraph" || q.type === "email" ||
               q.type === "number" || q.type === "phone")) {
    auto.focus();
    try { auto.setSelectionRange(auto.value.length, auto.value.length); } catch (e) {}
  }
}

function renderDone(token) {
  app.innerHTML = "";
  var slip = (settings().receipt || {}).enabled;
  // The slip's print stylesheet hides everything else, so it is only switched
  // on while a slip is on screen.
  document.body.classList.toggle("slip-on", !!slip);
  var again = settings().allowMultiple !== false
    ? el("button", {
        class: slip ? "fs-clear" : "fs-submit", type: "button",
        style: slip ? "" : "margin-top:14px",
        onclick: function () { answers = {}; errors = {}; step = 0; render(); window.scrollTo({ top: 0 }); }
      }, [slip ? "Next person" : "Submit another response"])
    : null;

  var body = el("div", { class: "fs-done" }, [
    el("span", { class: "tick", html: ICON.tick }),
    el("h2", { class: "dsp" }, ["Response recorded"]),
    el("p", {}, [settings().confirmationMessage || "Thank you!"]),
    (settings().quiz && settings().quizShowScore !== false) ? quizScoreBlock() : null,
    slip ? receiptSlip(token) : null,
    slip
      ? el("div", { class: "fs-slipacts" }, [
          el("button", {
            class: "fs-submit", type: "button",
            onclick: function () { window.print(); }
          }, ["Print / Save as PDF"]),
          again
        ])
      : again
  ]);
  var root = el("div", { class: rootClass() }, []);
  if (hasSide()) root.appendChild(panelSide());
  root.appendChild(el("div", { class: "fs-main" }, [body]));
  app.appendChild(root);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* -------------------------------------------------------------- keyboard */

document.addEventListener("keydown", function (e) {
  if (STYLE !== "focus" || sending) return;
  var t = e.target, typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT");
  if (e.key === "Enter" && !(typing && t.tagName === "TEXTAREA")) { e.preventDefault(); advance(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;

  var q = questions()[step];
  if (!q || (q.type !== "multiple_choice" && q.type !== "checkboxes")) return;
  var i = "abcdefghijklmnopqrstuvwxyz".indexOf(e.key.toLowerCase());
  var opt = (q.options || [])[i];
  if (!opt) return;
  e.preventDefault();
  if (q.type === "checkboxes") {
    var cur = answers[q.id] || [];
    var next = cur.filter(function (c) { return c !== opt.label; });
    if (next.length === cur.length) next.push(opt.label);
    setAnswer(q.id, next);
  } else setAnswer(q.id, opt.label);
});

/* ------------------------------------------------------------------ start */

if (!FORM || !FORM.questions) {
  app.innerHTML = '<div class="fatal"><h1>This form is not available</h1>' +
    '<p>The school computer sharing it may have stopped. Ask whoever sent you the link for a new one.</p></div>';
} else {
  render();
}
</script>
</body>
</html>
